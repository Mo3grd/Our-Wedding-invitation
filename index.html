  <link rel="preconnect" href="https://fonts.googleapis.com">

    rel="stylesheet"
  >

  <style>
    :root{
      --paper:#eee5da;
      --ink:#40362f;
      --muted:#76685d;
      --gold:#a48b70;
      --dark:#3e352e;
    }

    *{
      box-sizing:border-box;
    }

    html{
      scroll-behavior:smooth;
    }

    body{
      margin:0;
      background:#fff;
      color:var(--ink);
      font-family:"Tajawal",sans-serif;
      -webkit-font-smoothing:antialiased;
      overflow-x:hidden;
    }

    body.locked{
      overflow:hidden;
    }

    button,
    a{
      font:inherit;
    }

    /* =========================
       BLOOMING FLOWERS FRAME
    ========================== */

    .floral-frame{
      position:fixed;
      inset:0;
      z-index:9990;
      pointer-events:none;

      background:
        url("assets/floral-frame.svg")
        center center /
        100% 100%
        no-repeat;

      transform:translate3d(0,0,0);

      transition:
        transform .25s ease-out;
    }

    /* =========================
       OPENING
    ========================== */

    .opening{
      position:fixed;
      inset:0;
      z-index:10000;

      background:#fff;

      overflow:hidden;

      opacity:1;
      visibility:visible;

      transition:
        opacity .8s ease,
        visibility .8s ease;
    }

    .opening::after{
      content:"";

      position:absolute;
      inset:0;

      z-index:4;

      background:#fff;

      opacity:0;

      pointer-events:none;

      transition:
        opacity .8s ease;
    }

    .opening.closing::after{
      opacity:1;
    }

    .opening.hidden{
      opacity:0;
      visibility:hidden;
      pointer-events:none;
    }

    .opening-video{
      position:absolute;
      inset:0;

      width:100%;
      height:100%;

      object-fit:cover;
      object-position:center;

      display:block;

      background:#fff;
    }

    .opening-shade{
      position:absolute;
      inset:0;
      z-index:1;

      background:
        linear-gradient(
          180deg,
          rgba(0,0,0,0.03),
          rgba(0,0,0,0.10)
        );

      pointer-events:none;
    }

    .open-btn{
      position:absolute;
      z-index:5;

      left:50%;
      top:69%;

      transform:translate(-50%,-50%);

      border:1px solid rgba(255,255,255,.60);

      background:rgba(238,231,221,.42);

      color:#6e5336;

      padding:11px 27px;

      border-radius:30px;

      font-size:22px;
      font-weight:500;

      cursor:pointer;

      backdrop-filter:blur(8px);

      box-shadow:
        0 10px 30px rgba(0,0,0,.08);

      transition:
        opacity .3s ease,
        transform .3s ease,
        background .3s ease;
    }

    .open-btn:hover{
      background:rgba(255,255,255,.68);
    }

    .opening.closing .open-btn{
      opacity:0;
    }

    .video-error{
      position:absolute;
      z-index:6;

      left:50%;
      bottom:12%;

      transform:translateX(-50%);

      margin:0;

      background:rgba(255,255,255,.94);

      padding:10px 18px;

      border-radius:30px;

      color:#5b4939;

      font-size:14px;
    }

    /* =========================
       MAIN
    ========================== */

    #invitation{
      opacity:0;
      transform:translateY(18px);

      transition:
        opacity 1s ease .1s,
        transform 1s ease .1s;
    }

    #invitation.visible{
      opacity:1;
      transform:none;
    }

    /* =========================
       HERO
    ========================== */

    .hero{
      min-height:100svh;

      position:relative;

      display:grid;
      place-items:center;

      overflow:hidden;

      background:#44382f;
    }

    .hero-image{
      position:absolute;
      inset:0;

      background:
        url("assets/mohamed-mirna-vespa.jpeg")
        center center /
        cover
        no-repeat;

      transform:scale(1.015);
    }

    .hero-overlay{
      position:absolute;
      inset:0;

      background:
        linear-gradient(
          180deg,
          rgba(22,16,12,.18),
          rgba(22,16,12,.52)
        );
    }

    .hero-content{
      position:relative;
      z-index:2;

      color:#fff;

      text-align:center;

      padding:40px 26px;
    }

    .eyebrow{
      font-family:"Playfair Display",serif;

      font-size:18px;
      font-style:italic;

      margin:0 0 42px;

      opacity:.90;
    }

    .hero-arabic{
      font-size:18px;

      margin:0;

      opacity:.95;
    }

    .hero h1{
      font-family:"Tajawal",sans-serif;

      font-weight:400;

      font-size:
        clamp(
          46px,
          12vw,
          78px
        );

      margin:18px 0 10px;

      display:flex;

      gap:13px;

      justify-content:center;
      align-items:center;

      direction:ltr;

      text-shadow:
        0 3px 20px rgba(0,0,0,.2);
    }

    .hero h1 b{
      font-family:"Playfair Display",serif;

      font-size:.58em;

      font-weight:400;

      opacity:.9;
    }

    .hero-date{
      font-family:"Playfair Display",serif;

      font-size:23px;

      letter-spacing:5px;

      margin:0;
    }

    .hero-scroll{
      width:48px;
      height:48px;

      border:
        1px
        solid
        rgba(255,255,255,.6);

      border-radius:50%;

      display:grid;
      place-items:center;

      margin:
        42px
        auto
        0;

      font-size:24px;
    }

    .music-control{
      position:absolute;
      z-index:5;

      left:24px;
      bottom:25px;

      border:
        1px
        solid
        rgba(255,255,255,.45);

      background:
        rgba(30,24,20,.28);

      color:#fff;

      border-radius:30px;

      padding:
        10px
        15px;

      display:flex;

      align-items:center;

      gap:7px;

      cursor:pointer;

      backdrop-filter:blur(8px);
    }

    .music-icon{
      font-size:19px;
    }

    .music-control span:last-child{
      font-size:12px;
    }

    /* =========================
       SECTIONS
    ========================== */

    .paper{
      position:relative;

      overflow:hidden;

      background:
        radial-gradient(
          circle at 12% 10%,
          rgba(255,255,255,.68),
          transparent 28%
        ),
        radial-gradient(
          circle at 90% 70%,
          rgba(175,145,112,.13),
          transparent 28%
        ),
        var(--paper);

      padding:
        72px
        22px;

      text-align:center;
    }

    .ornament{
      color:var(--gold);

      letter-spacing:7px;

      margin-bottom:20px;
    }

    .kicker{
      font-size:18px;

      color:var(--muted);

      margin:
        0
        0
        20px;
    }

    .paper h2{
      font-weight:400;
    }

    .intro h2{
      font-size:24px;

      line-height:2.1;

      margin:
        0
        auto
        18px;

      max-width:760px;
    }

    .lead{
      font-size:18px;

      line-height:2.1;

      color:#65574d;
    }

    /* =========================
       COUNTDOWN
    ========================== */

    .countdown{
      display:grid;

      grid-template-columns:
        repeat(4,1fr);

      gap:9px;

      max-width:560px;

      margin:
        44px
        auto
        0;
    }

    .countdown div{
      border:
        1px
        solid
        rgba(100,80,62,.18);

      border-radius:
        70px
        70px
        0
        0;

      padding:
        22px
        4px
        17px;

      background:
        rgba(255,255,255,.08);
    }

    .countdown strong{
      display:block;

      font-family:"Playfair Display",serif;

      font-size:38px;

      font-weight:400;
    }

    .countdown span{
      font-size:13px;

      color:var(--muted);
    }

    /* =========================
       DETAILS
    ========================== */

    .details{
      padding-top:26px;
    }

    .detail-grid{
      display:grid;

      grid-template-columns:
        repeat(3,1fr);

      max-width:720px;

      margin:
        30px
        auto
        0;
    }

    .detail-item{
      padding:
        15px
        20px;

      display:flex;

      flex-direction:column;

      align-items:center;

      gap:7px;

      border-left:
        1px
        solid
        rgba(90,70,55,.15);
    }

    .detail-item:last-child{
      border-left:0;
    }

    .detail-item img{
      width:54px;
      height:54px;

      object-fit:contain;

      filter:
        sepia(25%)
        saturate(60%)
        opacity(.78);

      margin-bottom:5px;
    }

    .detail-item small{
      color:var(--muted);

      font-size:14px;
    }

    .detail-item b{
      font-weight:500;

      font-size:17px;

      line-height:1.65;
    }

    .detail-item em{
      font-style:normal;

      color:var(--muted);

      font-size:13px;
    }

    /* =========================
       VENUE
    ========================== */

    .venue-section{
      background:#b6a694;

      padding:
        68px
        22px;

      position:relative;

      overflow:hidden;
    }

    .venue-grid{
      max-width:1100px;

      margin:
        0
        auto;

      display:grid;

      grid-template-columns:
        minmax(0,1.15fr)
        minmax(320px,.85fr);

      gap:24px;

      align-items:stretch;

      direction:ltr;
    }

    .map-wrap{
      min-height:420px;

      overflow:hidden;

      box-shadow:
        0
        20px
        55px
        rgba(45,35,27,.2);

      background:#d9d0c7;
    }

    .map-wrap iframe{
      width:100%;
      height:100%;

      min-height:420px;

      border:0;

      display:block;
    }

    .venue-card{
      direction:rtl;

      background:
        rgba(247,238,228,.95);

      padding:
        45px
        38px;

      display:flex;

      flex-direction:column;

      justify-content:center;

      text-align:right;

      box-shadow:
        0
        20px
        55px
        rgba(45,35,27,.16);
    }

    .venue-card h2{
      font-family:"Playfair Display",serif;

      font-size:30px;

      font-weight:400;

      margin:
        0
        0
        8px;
    }

    .venue-card p{
      color:var(--muted);

      font-size:16px;
    }

    .venue-card a{
      display:inline-block;

      align-self:flex-start;

      border:
        1px
        solid
        #85705b;

      border-radius:30px;

      padding:
        11px
        19px;

      color:var(--ink);

      text-decoration:none;

      font-size:14px;

      margin-top:10px;
    }

    /* =========================
       CALENDAR
    ========================== */

    .calendar-section h2{
      margin:
        0
        0
        12px;

      font-size:
        clamp(
          24px,
          4vw,
          34px
        );

      font-weight:500;
    }

    .calendar-section > p:not(.kicker):not(.calendar-note){
      line-height:2;

      margin:
        0
        0
        22px;
    }

    .button{
      border:0;

      background:#665343;

      color:#fff;

      border-radius:30px;

      padding:
        13px
        30px;

      margin-top:12px;

      cursor:pointer;

      transition:
        transform .2s ease,
        background .2s ease;
    }

    .button:hover{
      background:#584638;

      transform:translateY(-1px);
    }

    .calendar-note{
      font-size:12px;

      opacity:.65;

      margin-top:12px;
    }

    /* =========================
       FOOTER
    ========================== */

    .footer{
      background:
        linear-gradient(
          135deg,
          #2c2723,
          #58493d
        );

      color:#f4e9dc;

      text-align:center;

      padding:
        78px
        20px;
    }

    .footer p{
      font-size:24px;

      margin:
        0
        0
        12px;
    }

    .footer small{
      font-family:"Playfair Display",serif;

      letter-spacing:3px;

      font-size:10px;
    }

    /* =========================
       MOBILE
    ========================== */

    @media (max-width:720px){

      .floral-frame{
        background-size:cover;

        background-position:center;
      }

      .opening-video{
        object-position:center;
      }

      .open-btn{
        top:69%;

        font-size:20px;
      }

      .hero{
        min-height:680px;
      }

      .hero h1{
        font-size:
          clamp(
            44px,
            12vw,
            66px
          );
      }

      .intro h2{
        font-size:20px;
      }

      .lead{
        font-size:16px;
      }

      .countdown{
        gap:6px;
      }

      .countdown strong{
        font-size:29px;
      }

      .countdown div{
        padding:
          18px
          3px
          14px;
      }

      .detail-grid{
        grid-template-columns:1fr;

        gap:0;
      }

      .detail-item{
        border-left:0;

        border-bottom:
          1px
          solid
          rgba(90,70,55,.12);

        padding:19px;
      }

      .detail-item:last-child{
        border-bottom:0;
      }

      .venue-section{
        padding:
          45px
          14px;
      }

      .venue-grid{
        grid-template-columns:1fr;

        gap:14px;

        direction:rtl;
      }

      .venue-card{
        order:1;

        padding:
          34px
          27px;
      }

      .map-wrap{
        order:2;

        min-height:300px;
      }

      .map-wrap iframe{
        min-height:300px;
      }

      .music-control{
        left:16px;

        bottom:18px;

        padding:
          9px
          12px;
      }

      .music-control span:last-child{
        font-size:11px;
      }
    }
  </style>
</head>

    class="floral-frame"
    aria-hidden="true"
  ></div>

       OPENING
  ========================== -->

          <img

        <div class="venue-card">

          <p class="kicker">

          <p>
            مصر - الشرقية - الزقازيق

            نازلة كوبري الأحرار

          <a

    <!-- Calendar -->

        ننتظركم لنحتفل سويًا

        مصر - الشرقية - الزقازيق
        <br>
        نازلة كوبري الأحرار
      </p>

      <button
        type="button"
        id="calendarButton"
        class="button"
      >
        أضف الموعد إلى التقويم
      </button>

      <p class="calendar-note">
        سيتم فتح Google Calendar أو تنزيل ملف الموعد حسب الجهاز.
      </p>

    </section>


    <!-- Footer -->

    <footer class="footer">

      <p>
        نلتقي لنصنع ذكرى أجمل ..
      </p>

      <small>
        THANK YOU FOR BEING A PART OF OUR STORY
      </small>

      <div class="ornament">
        — ♥ —
      </div>

    </footer>

  </main>


  <!-- Music -->

  <audio
    id="weddingAudio"
    src="assets/wedding-song.mp3"
    preload="auto"
    loop
  ></audio>


  <!-- =========================
       JAVASCRIPT
  ========================== -->

  <script>

    "use strict";


    /* =========================
       Wedding Date
    ========================== */

    const weddingDate =
      new Date(
        "2026-10-07T20:00:00+03:00"
      ).getTime();


    /* =========================
       Elements
    ========================== */

    const opening =
      document.getElementById("opening");

    const openingVideo =
      document.getElementById("openingVideo");

    const openBtn =
      document.getElementById("openBtn");

    const videoError =
      document.getElementById("videoError");

    const invitation =
      document.getElementById("invitation");

    const audio =
      document.getElementById("weddingAudio");

    const musicControl =
      document.getElementById("musicControl");

    const musicLabel =
      document.getElementById("musicLabel");

    const floralFrame =
      document.querySelector(".floral-frame");

    const calendarButton =
      document.getElementById("calendarButton");


    /* =========================
       Countdown
    ========================== */

    function setText(id,value){

      const el =
        document.getElementById(id);

      if(!el){
        return;
      }

      el.textContent =
        String(value).padStart(2,"0");
    }


    function updateCountdown(){

      const distance =
        Math.max(
          0,
          weddingDate - Date.now()
        );


      setText(
        "days",
        Math.floor(
          distance / 86400000
        )
      );


      setText(
        "hours",
        Math.floor(
          (distance % 86400000) /
          3600000
        )
      );


      setText(
        "minutes",
        Math.floor(
          (distance % 3600000) /
          60000
        )
      );


      setText(
        "seconds",
        Math.floor(
          (distance % 60000) /
          1000
        )
      );
    }


    updateCountdown();

    setInterval(
      updateCountdown,
      1000
    );


    /* =========================
       Music
    ========================== */

    function startMusic(){

      if(!audio){
        return;
      }

      audio.volume = 0.82;

      const promise =
        audio.play();


      if(
        promise &&
        typeof promise.then === "function"
      ){

        promise
          .then(function(){

            if(musicLabel){
              musicLabel.textContent =
                "إيقاف الموسيقى";
            }

          })
          .catch(function(){

            if(musicLabel){
              musicLabel.textContent =
                "تشغيل الموسيقى";
            }

          });
      }
    }


    /* =========================
       Show Invitation
    ========================== */

    let invitationShown = false;


    function showInvitation(){

      if(
        !opening ||
        invitationShown
      ){
        return;
      }


      invitationShown =
        true;


      opening.classList.add(
        "closing"
      );


      setTimeout(
        function(){

          opening.classList.add(
            "hidden"
          );


          if(invitation){

            invitation.classList.add(
              "visible"
            );

            invitation.setAttribute(
              "aria-hidden",
              "false"
            );
          }


          document.body.classList.remove(
            "locked"
          );


          window.scrollTo(
            0,
            0
          );

        },
        800
      );
    }


    /* =========================
       Open Video
    ========================== */

    let openingStarted = false;


    function openInvitation(){

      if(
        openingStarted ||
        !openingVideo
      ){
        return;
      }


      openingStarted = true;


      if(openBtn){

        openBtn.disabled =
          true;

        openBtn.textContent =
          "جارٍ الفتح...";

      }


      /* Start music from user gesture */

      startMusic();


      try{
        openingVideo.currentTime = 0;
      }catch(error){
        /* Ignore */
      }


      openingVideo.muted = true;

      openingVideo.playsInline = true;


      const playPromise =
        openingVideo.play();


      if(
        playPromise &&
        typeof playPromise.then === "function"
      ){

        playPromise
          .then(function(){

            if(videoError){

              videoError.hidden =
                true;

            }

          })
          .catch(function(){

            openingStarted =
              false;


            if(openBtn){

              openBtn.disabled =
                false;

              openBtn.textContent =
                "اضغط للفتح";

            }


            if(videoError){

              videoError.hidden =
                false;

              videoError.textContent =
                "اضغط مرة أخرى لتشغيل فيديو الافتتاح.";

            }

          });
      }
    }


    if(openBtn){

      openBtn.addEventListener(
        "click",
        openInvitation
      );

    }


    if(openingVideo){

      /* Video ended */

      openingVideo.addEventListener(
        "ended",
        showInvitation
      );


      /* Video error */

      openingVideo.addEventListener(
        "error",
        function(){

          if(videoError){

            videoError.hidden =
              false;

            videoError.textContent =
              "تعذر تحميل فيديو الافتتاح.";

          }

        }
      );

    }


    /* =========================
       Music Control
    ========================== */

    if(musicControl){

      musicControl.addEventListener(
        "click",
        function(){

          if(!audio){
            return;
          }


          if(audio.paused){

            startMusic();

          }else{

            audio.pause();


            if(musicLabel){

              musicLabel.textContent =
                "تشغيل الموسيقى";

            }

          }

        }
      );

    }


    /* =========================
       Blooming Frame Parallax
    ========================== */

    let frameTicking = false;


    window.addEventListener(
      "scroll",
      function(){

        if(frameTicking){
          return;
        }


        frameTicking = true;


        requestAnimationFrame(
          function(){

            const y =
              Math.min(
                window.scrollY || 0,
                900
              );


            if(floralFrame){

              floralFrame.style.transform =
                "translate3d(0," +
                (y * -0.012) +
                "px,0)";

            }


            frameTicking =
              false;

          }
        );

      },
      {
        passive:true
      }
    );


    /* =========================
       Google Calendar
    ========================== */

    function openGoogleCalendar(){

      const start =
        "20261007T200000";


      const end =
        "20261007T230000";


      const title =
        "زفاف محمد & ميرنا";


      const details =
        "يسعدنا ويشرفنا دعوتكم لحضور حفل زفاف محمد وميرنا.";


      const location =
        "مصر - الشرقية - الزقازيق - نازلة كوبري الأحرار";


      const url =
        "https://calendar.google.com/calendar/render" +
        "?action=TEMPLATE" +
        "&text=" +
        encodeURIComponent(title) +
        "&dates=" +
        start +
        "/" +
        end +
        "&details=" +
        encodeURIComponent(details) +
        "&location=" +
        encodeURIComponent(location) +
        "&ctz=Africa/Cairo";


      window.open(
        url,
        "_blank",
        "noopener,noreferrer"
      );

    }


    /* =========================
       ICS
    ========================== */

    function downloadICS(){

      const ics = [

        "BEGIN:VCALENDAR",

        "VERSION:2.0",

        "PRODID:-//Mohamed and Mirna Wedding//AR",

        "CALSCALE:GREGORIAN",

        "METHOD:PUBLISH",

        "BEGIN:VEVENT",

        "UID:mohamed-mirna-wedding-20261007@wedding-invite",

        "DTSTAMP:20260921T000000Z",

        "DTSTART;TZID=Africa/Cairo:20261007T200000",

        "DTEND;TZID=Africa/Cairo:20261007T230000",

        "SUMMARY:زفاف محمد & ميرنا",

        "DESCRIPTION:يسعدنا ويشرفنا دعوتكم لحضور حفل زفاف محمد وميرنا.",

        "LOCATION:مصر - الشرقية - الزقازيق - نازلة كوبري الأحرار",

        "END:VEVENT",

        "END:VCALENDAR"

      ].join("\r\n");


      const blob =
        new Blob(
          [ics],
          {
            type:
              "text/calendar;charset=utf-8"
          }
        );


      const url =
        URL.createObjectURL(blob);


      const link =
        document.createElement("a");


      link.href =
        url;


      link.download =
        "Mohamed-Mirna-Wedding.ics";


      document.body.appendChild(
        link
      );


      link.click();


      link.remove();


      setTimeout(
        function(){

          URL.revokeObjectURL(
            url
          );

        },
        1000
      );

    }


    /* =========================
       Calendar Button
    ========================== */

    if(calendarButton){

      calendarButton.addEventListener(
        "click",
        function(){

          const isMobile =
            /iPhone|iPad|iPod|Android/i.test(
              navigator.userAgent
            );


          if(isMobile){

            downloadICS();

          }else{

            openGoogleCalendar();

          }

        }
      );

    }

  </script>

</body>
